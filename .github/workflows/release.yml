name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Release
        run: |
          xcodebuild \
            -project ClipShotHistory.xcodeproj \
            -scheme ClipShotHistory \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip app
        run: |
          ditto -c -k --keepParent \
            DerivedData/Build/Products/Release/Pastefinch.app \
            Pastefinch.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pastefinch ${{ github.ref_name }}
          body: |
            ## Pastefinch ${{ github.ref_name }}

            Menu bar clipboard + screenshot history for macOS.

            ### Install
            1. Download `Pastefinch.zip`
            2. Unzip and move `Pastefinch.app` to Applications
            3. Right-click → Open on first launch if Gatekeeper blocks

            ### Hotkey
            - `⌥⌘V` — show history panel
          files: Pastefinch.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
